name: Release Live Demo

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: PixiJS/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: PixiJS
      - run: npm run client-build
        working-directory: PixiJS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: PixiJS/dist
      - id: deployment
        uses: actions/deploy-pages@v4
