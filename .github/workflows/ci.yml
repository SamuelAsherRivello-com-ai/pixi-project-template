name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PixiJS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: PixiJS/package-lock.json
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm run client-build
      - run: npm run test -- --runInBand
